tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact and return the created object
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
          email:
            type: string
            example: 'john@example.com'
          phone:
            type: string
            example: '+380971234567'
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            example: work
          photo:
            type: string
            format: binary
        required:
          - name
          - phone
          - contactType
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/contacts.yaml
  '400':
    description: Invalid input data
  '404':
    $ref: ../../components/responses/404.yaml
