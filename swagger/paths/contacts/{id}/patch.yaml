tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update an existing contact by ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    description: Contact ID
    schema:
      type: string
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
          phone:
            type: string
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: [work, home, personal]
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/contacts.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
