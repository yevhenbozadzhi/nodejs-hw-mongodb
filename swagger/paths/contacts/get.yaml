tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve a list of all contacts. Supports pagination and filtering.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      example: name
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
  - in: query
    name: isFavourite
    schema:
      type: boolean
responses:
  '200':
    description: Successfully fetched contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Success
            data:
              type: object
              properties:
                contacts:
                  type: array
                  items:
                    $ref: ../../components/schemas/contacts.yaml
                paginationData:
                  type: object
                  properties:
                    page:
                      type: integer
                      example: 1
                    perPage:
                      type: integer
                      example: 10
                    total:
                      type: integer
                      example: 50
                    totalPages:
                      type: integer
                      example: 5
  '404':
    $ref: ../../components/responses/404.yaml
